apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embedding-api
  template:
    metadata:
      labels:
        app: embedding-api
    spec:
      containers:
        - name: api
          image: demo/embed-api:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: model-weights
              mountPath: /models
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: model-weights
          image:
            reference: demo/embed-weights:v1
            pullPolicy: Never
